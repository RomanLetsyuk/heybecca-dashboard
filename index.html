<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeyBecca — дашборд</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#524A42; --acc2:#6E635A; --acc-soft:#F7F3E3;
  --bg:#F4F0E2; --card:#fff; --line:#E4DECF; --line2:#EFEBDD;
  --ink:#2E2822; --ink2:#6B6259; --ink3:#A29A90;
  --up:#4A6B3F; --dn:#A91100; --warn:#6E5A1E; --warn-bg:#FDF5C4;
}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:26px 20px 60px}
.n{font-variant-numeric:tabular-nums}
::selection{background:var(--warn-bg);color:var(--ink)}

/* ---- gate ---- */
#gate{position:fixed;inset:0;background:linear-gradient(150deg,#2E2822,#4A423A);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:20px}
#gate .box{background:#fff;border-radius:18px;padding:34px 32px;width:min(400px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
#gate .lg{margin-bottom:20px}
#gate .lg svg{height:32px;width:auto;display:block}
#gate h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#gate p{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
#gate input[type=password]{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:#FBFAF6;color:var(--ink)}
#gate input[type=password]:focus{outline:none;border-color:var(--acc);background:#fff}
#gate button{width:100%;margin-top:10px;font:inherit;font-size:15px;font-weight:700;padding:12px;
  border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
#gate button:hover{background:var(--acc2)}
#gate .err{color:var(--dn);font-size:13px;margin-top:10px;min-height:18px;font-weight:600}
#gate label{display:flex;gap:7px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.35}
#gate input[type=checkbox]{accent-color:var(--acc)}

/* ---- header ---- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header .lgw{display:flex;align-items:center;gap:15px}
header .lgw svg{height:34px;width:auto}
header .div{width:1px;height:38px;background:var(--line)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1.t{font-size:26px;font-weight:800;letter-spacing:-.025em;margin-top:2px;color:var(--ink)}
.upd{font-size:12.5px;color:var(--ink3);text-align:right;line-height:1.6}
.upd b{color:var(--ink2);font-weight:600}

/* ---- tabs ---- */
nav.tabs{display:flex;gap:4px;background:#E9E3D4;padding:4px;border-radius:12px;margin-bottom:20px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs button{font:inherit;font-size:14px;font-weight:650;padding:9px 16px;border:0;border-radius:9px;
  background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(46,40,34,.12)}

/* ---- controls ---- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:16px}
.bar .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.seg{display:flex;gap:3px;background:#EFEADB;padding:3px;border-radius:9px}
.seg button{font:inherit;font-size:13px;font-weight:650;padding:6px 12px;border:0;border-radius:7px;
  background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(46,40,34,.1)}
select,input[type=date],input[type=number],input[type=search]{font:inherit;font-size:13.5px;padding:7px 10px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--acc)}
.sp{flex:1}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.card .v{font-size:24px;font-weight:800;letter-spacing:-.025em;margin-top:5px;color:var(--ink)}
.card .v small{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:0}
.card .d{font-size:12.5px;font-weight:700;margin-top:3px}
.card .d span{color:var(--ink3);font-weight:600}
.card .x{font-size:12.5px;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}
.card .x b{color:var(--ink);font-weight:750}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--ink3)}

/* ---- sections ---- */
h2{font-size:18px;font-weight:750;margin:30px 0 12px;display:flex;align-items:center;gap:10px;
  letter-spacing:-.01em;color:var(--ink)}
h2::before{content:"";width:4px;height:18px;background:var(--acc);border-radius:3px;flex:none}
h2 .hint{font-size:12px;font-weight:600;color:var(--ink3);margin-left:auto;letter-spacing:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px}
.scroll{overflow-x:auto}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#F5F2E7;text-align:right;padding:11px 12px;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink2);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
th.l,td.l{text-align:left}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--acc)}
th .ar{opacity:.4;font-size:9px}
td{padding:10px 12px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap}
tbody tr:hover td{background:#FBF9F2}
tr.tot td{font-weight:800;background:#F7F4EA;border-top:2px solid var(--line)}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.tbl-wrap.scroll{overflow-x:auto;overflow-y:visible;position:relative}
table.compact{font-size:12px}
table.compact th{padding:9px 6px;font-size:10px;letter-spacing:.03em}
table.compact td{padding:8px 6px}
table.compact th.l:first-child,table.compact td.l:first-child{position:sticky;left:0;z-index:2;
  background:var(--card);box-shadow:1px 0 0 var(--line)}
table.compact thead th.l:first-child{background:#F5F2E7;z-index:3}
table.compact tbody tr:hover td.l:first-child{background:#FBF9F2}
table.compact tr.tot td.l:first-child{background:#F7F4EA}
.tbl-wrap.scroll::after{content:"";position:absolute;top:0;right:0;bottom:0;width:26px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95))}
.scrollhint{font-size:11.5px;color:var(--ink3);margin:-6px 0 12px;text-align:right}
.srcbox{display:flex;gap:0;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:13px;overflow:hidden;margin-bottom:14px}
.src{flex:1 1 240px;padding:12px 15px;border-left:1px solid var(--line2);font-size:12.5px;line-height:1.55}
.src:first-child{border-left:0}
.src b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.src.a b{color:#8A5A2B}.src.g b{color:#2E6B45}.src.c b{color:#7A3B5C}
.src span{color:var(--ink2)}
.tagA,.tagG,.tagC{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px}
.tagA{background:#F4E7D6;color:#8A5A2B}.tagG{background:#E2EFE7;color:#2E6B45}.tagC{background:#F3E3EC;color:#7A3B5C}
.mix{font-size:11px;color:var(--ink2);white-space:normal;line-height:1.4;max-width:230px;display:inline-block}
.mix i{font-style:normal;color:var(--dn);font-weight:700}
.mut{color:var(--ink3)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.p-on{background:#E7F0E3;color:var(--up)}.p-off{background:#EDE8DA;color:var(--ink3)}
.note{background:var(--warn-bg);border:1px solid #EEDFA0;color:var(--warn);border-radius:11px;
  padding:11px 15px;font-size:13.5px;margin-bottom:14px;line-height:1.6}
.note.soft{background:#FBF9F2;border-color:var(--line);color:var(--ink2)}
.note b{font-weight:750}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---- funnel ---- */
.fun{display:flex;flex-direction:column;gap:2px}
.fstep{display:grid;grid-template-columns:200px 1fr 155px;gap:14px;align-items:center;padding:7px 0}
.fstep .fn{font-weight:650;font-size:14px}
.fstep .fn em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
.fbar{height:34px;background:#EFEADB;border-radius:7px;position:relative;overflow:hidden}
.fbar div{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#524A42,#7C7267);border-radius:7px}
.fbar div.b2{background:linear-gradient(90deg,#B9AF9E,#CDC4B4)}
.fbar span{position:absolute;left:11px;top:0;line-height:34px;font-size:13.5px;font-weight:750;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fbar span.out{left:auto;color:var(--ink2);text-shadow:none}
.fcr{text-align:right;font-size:14px;font-weight:750}
.fcr em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.cmp2{grid-template-columns:1fr}.fstep{grid-template-columns:132px 1fr 98px;gap:8px}}

/* ---- тривога по балансу ---- */
.alarm{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FBEAE6;border:1px solid #E9B7AC;
  border-left:4px solid var(--dn);border-radius:11px;padding:13px 16px;margin-bottom:18px;font-size:13.5px}
.alarm b{color:var(--dn);font-weight:800}
.alarm>b{font-size:14.5px}
.alarm span{color:#7A2A1C;line-height:1.55;flex:1;min-width:260px}
.alarm button{font:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border:0;border-radius:8px;
  background:var(--dn);color:#fff;cursor:pointer}
.bal-bar{height:30px;background:#EFEADB;border-radius:8px;position:relative;overflow:hidden;margin:10px 0 6px}
.bal-bar div{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#524A42,#7C7267)}
.bal-bar span{position:absolute;left:11px;top:0;line-height:30px;font-size:12.5px;font-weight:750;color:#fff}

/* ---- виконання плану ---- */
.gaphdr{margin:16px 0 2px;padding-top:14px;border-top:1px solid var(--line2);
  font-size:13px;font-weight:750;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gaphdr span{font-weight:600;font-size:12.5px;color:var(--ink3);margin-left:auto}
.pace{display:grid;grid-template-columns:118px 1fr 210px;gap:16px;align-items:center;padding:13px 0;
  border-top:1px solid var(--line2)}
.pace:first-child{border-top:0;padding-top:2px}
.pace .pl{font-weight:750;font-size:14px}
.pace .pl em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
.pbar{position:relative;height:38px;background:#EFEADB;border-radius:8px;overflow:hidden}
.pbar .pproj{position:absolute;left:0;top:0;height:100%;background:#DCD3C4}
.pbar .pfill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#524A42,#7C7267)}
.pbar .pmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dn);z-index:3}
.pbwrap{position:relative;padding-top:19px}
.pmarklab{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;font-weight:700;
  color:var(--dn);white-space:nowrap;line-height:1.2}
.pmarklab::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:5px;background:var(--dn)}
.pbar .ptxt{position:absolute;left:11px;top:0;line-height:38px;font-size:13px;font-weight:750;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
.pbar .ptxt.out{color:var(--ink2);text-shadow:none}
.pace .pn{text-align:right;font-size:13px;line-height:1.5}
.pace .pn b{font-size:15px;font-weight:800;display:block}
.pace .pn span{color:var(--ink3);font-weight:600;font-size:12px}
.plegend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line2)}
.plegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---- chart ---- */
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.tip{position:fixed;background:#2E2822;color:#F7F3E3;font-size:12px;padding:8px 11px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;white-space:pre;line-height:1.45}
footer{margin-top:34px;text-align:center;color:var(--ink3);font-size:12px}
.hide{display:none!important}
#newver{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;background:var(--ink);
  color:var(--cream);padding:11px 16px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:0 8px 26px rgba(46,40,34,.3);display:flex;gap:12px;align-items:center}
#newver button{font:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border:0;border-radius:8px;
  background:var(--cream);color:var(--ink);cursor:pointer}
</style>

<script>
/* ═══════════ 0. Розшифровка ═══════════ */
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pw){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(blob.s),iterations:blob.it,hash:'SHA-256'},
    key,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv)},k,b64d(blob.ct));
  const ds=new DecompressionStream('gzip');
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}

const IDX={};
function buildIndexes(){
  const nd=P.dates.length;
  // Ads по днях (усі кампанії)
  const A=IDX.ads=Array.from({length:nd},()=>[0,0,0,0,0]); // cost, clicks, impr, conv, value
  P.ads.daily.forEach(([di,ci,cost,clk,imp,cv,val])=>{
    const a=A[di]; a[0]+=cost; a[1]+=clk; a[2]+=imp; a[3]+=cv; a[4]+=val;});
  // Ads: конверсійна дія «Purchase (Custom)» окремо
  const cust=P.actions.indexOf('Purchase (Custom)');
  const C=IDX.cust=Array.from({length:nd},()=>[0,0]);
  P.ads.conv.forEach(([di,ai,c,v])=>{ if(ai===cust){C[di][0]+=c;C[di][1]+=v;} });
  // GA4 усього по днях + google/cpc
  const G=IDX.ga4=Array.from({length:nd},()=>[0,0,0,0]); // sess, users, tx, rev
  P.ga4.ch_daily.forEach(([di,ci,s,u,t,r])=>{const g=G[di];g[0]+=s;g[1]+=u;g[2]+=t;g[3]+=r;});
  // all_conversions по кожній конверсійній дії (для послідовного ряду через усю історію)
  IDX.act={};
  P.ads.conv.forEach(([di,ai,c,v])=>{
    const A=IDX.act[ai]||(IDX.act[ai]=Array.from({length:nd},()=>[0,0]));
    A[di][0]+=c; A[di][1]+=v;});
  // які дії були ОСНОВНИМИ (формували metrics.conversions) у конкретний день
  IDX.prim=Array.from({length:nd},()=>({}));
  (P.ads.prim||[]).forEach(([di,pi,c,v])=>{ IDX.prim[di][pi]=(IDX.prim[di][pi]||0)+c; });
  const smi=P.ga4.sms.indexOf('google / cpc');
  const Q=IDX.cpc=Array.from({length:nd},()=>[0,0,0]); // sess, tx, rev
  P.ga4.sm_daily.forEach(([di,si,s,t,r])=>{ if(si===smi){const q=Q[di];q[0]+=s;q[1]+=t;q[2]+=r;} });
}

function range(from,to){ // ISO → [i0,i1]
  let i0=DI[from], i1=DI[to];
  if(i0==null){i0=P.dates.findIndex(d=>d>=from); if(i0<0)i0=0;}
  if(i1==null){for(let i=P.dates.length-1;i>=0;i--)if(P.dates[i]<=to){i1=i;break} if(i1==null)i1=P.dates.length-1;}
  return [i0,i1];
}
function sumAds(i0,i1,camps){
  const o={cost:0,clicks:0,impr:0,conv:0,val:0};
  if(camps&&camps.size){
    P.ads.daily.forEach(([di,ci,c,k,m,cv,v])=>{ if(di<i0||di>i1||!camps.has(ci))return;
      o.cost+=c;o.clicks+=k;o.impr+=m;o.conv+=cv;o.val+=v;});
  }else{
    for(let i=i0;i<=i1;i++){const a=IDX.ads[i];o.cost+=a[0];o.clicks+=a[1];o.impr+=a[2];o.conv+=a[3];o.val+=a[4];}
  }
  const S=convSeries();
  if(S&&!(camps&&camps.size)){o.conv=0;o.val=0;
    for(let i=i0;i<=i1;i++){o.conv+=S[i][0];o.val+=S[i][1];}}
  o.costV=o.cost*P.meta.vat;
  o.cpc=o.clicks?o.costV/o.clicks:null;
  o.cpa=o.conv?o.costV/o.conv:null;
  o.roas=o.costV?o.val/o.costV:null;
  o.drr=o.val?o.costV/o.val:null;
  o.cr=o.clicks?o.conv/o.clicks:null;
  o.aov=o.conv?o.val/o.conv:null;
  return o;
}

function chart(labels,bars,line,opt={}){
  const W=1200,H=opt.h||260,pl=64,pt=14,pb=30;
  const pr=line?64:26;
  const iw=W-pl-pr, ih=H-pt-pb, n=labels.length;
  if(!n)return '<div class="mut" style="padding:20px">немає даних</div>';
  const bmax=Math.max(...bars,...(opt.barLine||[0]),...((opt.barLine2||[]).filter(v=>v!=null)),1), lmax=Math.max(...(line||[0]),1);
  const bw=Math.max(1,iw/n*0.72), step=iw/n;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let g=0;g<=4;g++){const y=pt+ih*g/4;
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#EDE8DA"/>`;
    s+=`<text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#A9A29C">${fmt(bmax*(1-g/4),bmax<20?1:0)}</text>`;
    if(line)s+=`<text x="${W-pr+8}" y="${y+4}" font-size="11" fill="#524A42">${fmt(lmax*(1-g/4),lmax<20?1:0)}</text>`;}
  const sp=opt.splitAt==null?bars.length:opt.splitAt;
  bars.forEach((v,i)=>{const h=ih*v/bmax, xx=pl+step*i+(step-bw)/2;
    const col=i<sp?(opt.bc||'#DCD3C4'):(opt.bc2||'#EDE8DA');
    s+=`<rect class="bar" data-i="${i}" x="${xx}" y="${pt+ih-h}" width="${bw}" height="${Math.max(h,0)}" fill="${col}" />`;});
  const dash=(arr,col,dsh,wd)=>{ if(!arr)return '';
    let d='',pen=0;
    arr.forEach((v,i)=>{ if(v==null){pen=0;return;}
      const xx=pl+step*i+step/2, y=pt+ih-ih*v/bmax; d+=(pen?'L':'M')+xx+' '+y; pen=1;});
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd||2}" stroke-dasharray="${dsh}" stroke-linecap="round" stroke-linejoin="round"/>`:'';};
  s+=dash(opt.barLine,'#A91100','7 5');
  s+=dash(opt.barLine2,'#2E6B45','1 6',3);
  if(line){let d='';line.forEach((v,i)=>{const xx=pl+step*i+step/2, y=pt+ih-ih*v/lmax; d+=(i?'L':'M')+xx+' '+y;});
    s+=`<path d="${d}" fill="none" stroke="#524A42" stroke-width="2" stroke-linejoin="round"/>`;}
  const lab=n<=14?1:Math.ceil(n/12);
  labels.forEach((l,i)=>{ if(i%lab)return;
    s+=`<text x="${pl+step*i+step/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="#A9A29C">${esc(l)}</text>`;});
  bars.forEach((v,i)=>{s+=`<rect class="hit" data-i="${i}" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>`;});
  s+='</svg>';
  return `<div class="chart" data-tips='${JSON.stringify(opt.tips||[]).replace(/'/g,"&#39;")}'>${s}</div>`;
}

/* ═══════════ 7. Прогноз місяця ═══════════ */
function dowWeights(getter,i1,back=56){
  const s=new Array(7).fill(0),c=new Array(7).fill(0);
  for(let i=Math.max(0,i1-back+1);i<=i1;i++){const d=dl(P.dates[i]).getDay();s[d]+=getter(i);c[d]++;}
  const av=s.reduce((a,b)=>a+b,0)/Math.max(1,c.reduce((a,b)=>a+b,0));
  return s.map((v,d)=>c[d]&&av?(v/c[d])/av:1);
}
function forecast(getter,i0,i1,mEnd){
  const w=dowWeights(getter,i1);
  let recent=0,rn=0;
  for(let i=Math.max(0,i1-13);i<=i1;i++){recent+=getter(i);rn++;}
  const base=rn?recent/rn:0;
  let mtd=0; for(let i=i0;i<=i1;i++)mtd+=getter(i);
  let rest=0; const last=dl(P.dates[i1]);
  for(let d=new Date(last.getFullYear(),last.getMonth(),last.getDate()+1);d<=mEnd;d.setDate(d.getDate()+1))
    rest+=base*w[d.getDay()];
  return {mtd,rest,total:mtd+rest,base};
}

/* ═══════════ 8. Історія по місяцях ═══════════ */
function monthRows(){
  return MONTHS.map(mk=>{
    const [i0,i1]=range(mk+'-01',mk+'-31');
    if(P.dates[i0].slice(0,7)!==mk)return null;
    const A=sumAds(i0,i1), G=sumArr(IDX.cpc,i0,i1,3), CU=sumArr(IDX.cust,i0,i1,2);
    const rt=P.rates[mk]||rate(mk+'-15');
    const c=P.crm&&P.crm.months&&P.crm.months[mk]||null;
    return {mk,A,G,CU,rt,c};
  }).filter(Boolean);
}

function funAgg(i0,i1,split){
  const src=split==='ch'?P.ga4.fun_ch:P.ga4.fun_sm;
  const b=ST.funBasis==='sess'?3:4, ns=P.meta.steps.length;
  const by={};
  src.forEach(r=>{ if(r[0]<i0||r[0]>i1)return;
    (by[r[1]]||(by[r[1]]=new Array(ns).fill(0)))[r[2]]+=r[b];});
  return by;
}
function funNames(split){return split==='ch'?P.ga4.chs:P.ga4.sms}
function funTotal(by,pick){
  const ns=P.meta.steps.length,t=new Array(ns).fill(0);
  Object.entries(by).forEach(([k,v])=>{ if(pick!=='__all__'&&+k!==+pick)return;
    v.forEach((x,i)=>t[i]+=x);});
  return t;
}
function funnelHTML(t,title,sub,alt){
  const L=P.meta.step_labels, top=t[0]||1;
  return `<div><div style="font-weight:750;font-size:14.5px;margin-bottom:2px">${title}</div>
    <div class="mut" style="font-size:12.5px;margin-bottom:10px">${sub}</div>
    <div class="fun">${t.map((v,i)=>{
      const w=Math.max(v/top*100,0), prev=i?t[i-1]:null;
      const cr=prev?v/prev:null, all=i?v/top:null, wide=w>18;
      return `<div class="fstep">
        <div class="fn">${L[i]}<em>${P.meta.steps[i]}</em></div>
        <div class="fbar"><div class="${alt?'b2':''}" style="width:${w}%"></div>
          <span class="${wide?'':'out'}" style="${wide?'':'left:'+w+'%;margin-left:11px'}">${fmt(v)}</span></div>
        <div class="fcr">${cr==null?'100%':pct(cr,cr<0.1?2:1)}
          <em>${all==null?'старт воронки':'від сеансів '+pct(all,2)}</em></div></div>`}).join('')}</div></div>`;
}

        const bad=v=>v!=null&&Math.abs(v)>0.3?'dn':'';
        return `<tr><td class="l">${gran==='day'?k:MN[+k.slice(5)-1]+' '+k.slice(0,4)}</td>
        <td class="n">${fmt(b.clk)}</td><td class="n">${fmt(b.sess)}</td>
        <td class="n ${bad(d1)}">${d1==null?'—':(d1>0?'+':'')+fmt(d1*100,1)+'%'}</td>
        <td class="n">${fmt(b.conv,0)}</td><td class="n">${fmt(b.tx)}</td>
        <td class="n ${bad(d2)}">${d2==null?'—':(d2>0?'+':'')+fmt(d2*100,1)+'%'}</td>
        <td class="n">${money(b.val)}</td><td class="n">${money(b.rev)}</td></tr>`}).join('')}
     </tbody></table></div>
    <h2>По кампаніях<span class="hint">назви зводяться за збігом</span></h2>
    <div class="tbl-wrap scroll"><table data-sk="rec"><thead><tr>
      ${th('Кампанія',0,'rec','l')}${th('Кліки Ads',1,'rec')}${th('Сеанси GA4',2,'rec')}${th('Розходження',3,'rec')}${th('Транз. GA4',4,'rec')}</tr></thead>
      <tbody>${sortedN.map(r=>`<tr><td class="l">${esc(r.v[0])}</td><td class="n">${fmt(r.v[1])}</td>
        <td class="n">${fmt(r.v[2])}</td>
        <td class="n ${r.v[3]!=null&&Math.abs(r.v[3])>0.3?'dn':''}">${r.v[3]==null?'—':(r.v[3]>0?'+':'')+fmt(r.v[3]*100,1)+'%'}</td>
        <td class="n">${fmt(r.v[4])}</td></tr>`).join('')}</tbody></table></div>`;
  const kk=ks.slice().reverse();
  $('#rch').innerHTML=chart(kk.map(k=>gran==='day'?nice(k):MN[+k.slice(5)-1]+' '+k.slice(2,4)),
    kk.map(k=>buckets[k].clk),kk.map(k=>buckets[k].sess),
    {h:230,bc:'#E0D8C8',tips:kk.map(k=>{const b=buckets[k];
      return `${k}\nкліки Ads ${fmt(b.clk)}\nсеанси GA4 ${fmt(b.sess)}\nрозходження ${b.clk?fmt((b.sess-b.clk)/b.clk*100,1)+'%':'—'}`})});
  wirePeriod('re',p=>{ST.recPer=p},(f,t)=>{ST.recPer='custom';ST.from=f;ST.to=t});
  $('#rgr').querySelectorAll('button').forEach(b=>b.onclick=()=>{ST.recGran=b.dataset.g;render()});
}

/* ═══════════ 10b. Баланс акаунту ═══════════ */
function tabBal(){
  const b=balInfo();
  if(!P.billing||!P.billing.current){
    $('#body').innerHTML='<div class="note">Не вдалося прочитати бюджет акаунту через API.</div>'; return;}
  const c=P.billing.current, th=alertDays();
  if(c.left==null){
    $('#body').innerHTML=`<div class="note"><b>В акаунті стоїть бюджет без обмеження (INFINITE).</b>
      Залишок коштів у такому режимі Google через API не віддає — відстежувати треба в кабінеті.</div>`; return;}
  const spent=c.served, lim=c.limit+c.adj, used=lim?spent/lim:0;
  const pace=P.billing.pace7, pace14=P.billing.pace14;
  const d7=c.left/(pace||1), d14=c.left/(pace14||1);
  const need=n=>Math.max(0,n*pace-c.left);   // скільки долити, щоб вистачило на n днів
  const hist=P.billing.history.filter(h=>h.limit).slice().reverse();
  $('#body').innerHTML=
   (b&&b.low?`<div class="note"><b>Залишку вистачить менш ніж на ${fmt(th,0)} дн.</b>
      Щоб дотягнути до кінця вересня (${fmt(30-dl(P.billing.as_of).getDate(),0)} дн.), треба долити
      ще <b>${money(need(30-dl(P.billing.as_of).getDate()))}</b> нетто —
      це ${money(need(30-dl(P.billing.as_of).getDate())*P.meta.vat)} з ПДВ.</div>`:'')+
   cardsHTML([
    {k:'Залишок на акаунті',v:money(c.left),sub:'нетто, без ПДВ'},
    {k:'Вистачить на',v:fmt(d7,1)+' дн.',sub:'за темпом 7 днів'},
    {k:'Закінчиться',v:P.billing.empty_on?nice(P.billing.empty_on):'—',sub:'приблизна дата'},
    {k:'Темп витрат',v:money(pace)+'/дн',sub:'за 14 дн. '+money(pace14)+'/дн'},
    {k:'Витрачено з бюджету',v:money(spent),sub:'з '+money(lim)},
    {k:'Поточний бюджет відкрито',v:c.start?nice(c.start.slice(0,10)):'—',sub:'ліміт '+money(c.limit)},
   ])+
   `<h2>Поточний бюджет<span class="hint">${fmt(used*100,1)}% використано</span></h2>
    <div class="panel">
      <div class="bal-bar"><div style="width:${Math.min(used*100,100)}%"></div>
        <span>витрачено ${money(spent)}</span></div>
      <div class="legend"><span>ліміт ${money(lim)}</span><span>залишок <b>${money(c.left)}</b></span>
        <span>відкрито ${c.start?nice(c.start.slice(0,10)):'—'}</span></div>
    </div>
    <h2>Скільки треба долити<span class="hint">нетто · з ПДВ</span></h2>
    <div class="tbl-wrap scroll"><table><thead><tr><th class="l">Щоб вистачило на</th>
      <th>Потрібно всього</th><th>Долити нетто</th><th>Долити з ПДВ</th><th>Вистачить до</th></tr></thead><tbody>
      ${[7,14,21,30].map(n=>{const t=n*pace, add=need(n);
        const till=new Date(dl(P.billing.as_of)); till.setDate(till.getDate()+n);
        return `<tr><td class="l"><b>${n} днів</b></td><td class="n">${money(t)}</td>
          <td class="n ${add>0?'dn':'up'}">${add>0?money(add):'вистачає'}</td>
          <td class="n">${add>0?money(add*P.meta.vat):'—'}</td>
          <td class="n mut">${nice(iso(till))}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="bar" style="margin-top:14px"><span class="lbl">Попереджати, коли лишилось менше ніж</span>
      <input type="number" id="alrt" value="${th}" min="1" max="60" style="width:80px"> днів
      <button id="alrtsave" style="font:inherit;font-weight:700;padding:7px 15px;border:0;border-radius:8px;
        background:var(--acc);color:#fff;cursor:pointer">Зберегти</button>
      <span class="mut">попередження показується на всіх вкладках і дублюється сповіщенням на Mac</span></div>
    <h2>Історія поповнень<span class="hint">усі бюджети акаунту</span></h2>
    <div class="tbl-wrap scroll"><table class="compact"><thead><tr><th class="l">Відкрито</th><th class="l">Закрито</th>
      <th>Ліміт</th><th>Коригування</th><th>Витрачено</th><th>Залишок</th><th>Днів</th><th>Середньодобово</th></tr></thead><tbody>
      ${hist.map(h=>{const st=h.start.slice(0,10), en=h.end?h.end.slice(0,10):null;
        const days=Math.max(1,Math.round(((en?dl(en):dl(P.billing.as_of))-dl(st))/864e5));
        const rest=h.limit+h.adj-h.served;
        return `<tr><td class="l">${nice(st)} ${st.slice(0,4)}</td>
          <td class="l">${en?nice(en)+' '+en.slice(0,4):'<span class="pill p-on">активний</span>'}</td>
          <td class="n">${money(h.limit)}</td><td class="n mut">${h.adj?money(h.adj):'—'}</td>
          <td class="n">${money(h.served)}</td>
          <td class="n ${!en&&rest<pace*th?'dn':''}">${money(rest)}</td>
          <td class="n mut">${days}</td><td class="n">${money(h.served/days)}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="note soft" style="margin-top:12px">Дані — <b>Google Ads API</b>, ресурс <b>account_budget</b>
      акаунту 3627812095. Суми <b>нетто</b>, бо саме так Google списує з бюджету; поповнення з ПДВ
      буде ×${P.meta.vat}. «Вистачить на» рахується від середньодобових витрат за останні 7 днів
      (${money(pace)}); за темпом 14 днів (${money(pace14)}) вийшло б ${fmt(d14,1)} дн.</div>`;
  const a=$('#alrtsave'); if(a)a.onclick=()=>{const v=parseFloat($('#alrt').value);
    if(isFinite(v)&&v>0){try{localStorage.setItem('hb_alert',String(v))}catch(e){}render();}};
}

/* ═══════════ 11. CRM ═══════════ */
function tabCrm(){
  if(!P.crm){ $('#body').innerHTML=`<div class="note">
    <b>CRM ще не підключена.</b> Треба доступ до Google-таблиці клієнта з колонками Key CRM
    (кількість покупок GOOGLE, сума покупки CRM) і планом. Після підключення тут з'явиться
    звірка «кабінет проти CRM» по місяцях і по днях, а колонки CRM заповняться у вкладці «Історія по місяцях».</div>`;
    return; }
  const rows=monthRows().filter(r=>r.c&&r.c.orders);
  const cur=ST.cur==='usd', M=(v,rt,d=0)=>cur?usd(v/rt,d):money(v,d);
  const last=rows[rows.length-1];
  const kx=r=>r.c.orders?r.A.conv/r.c.orders:null;
  $('#body').innerHTML=`
   <div class="bar"><span class="lbl">Валюта</span><div class="seg" id="curseg">
     <button data-c="uah" class="${!cur?'on':''}">₴</button><button data-c="usd" class="${cur?'on':''}">$</button></div>
     <span class="sp"></span><span class="mut">${(()=>{const c=crmInfo();
       return `вивантажка від клієнта${c.fileDate?' ('+c.fileDate+')':''} · дані по ${c.lastLabel} · оновлюється вручну`})()}</span></div>
     ${(()=>{const c=crmInfo();return c.stale?`<div class="note"><b>CRM відстає від реклами.</b>
       Цифри Ads і GA4 тут по ${nice(ST.adsEnd)}, а CRM — тільки по ${c.lastLabel}: це остання вивантажка від клієнта.
       Місяці без CRM у таблиці нижче не показані. Щоб оновити — покласти новий CSV у
       <b>heybecca/data/crm_*.csv</b> і запустити <b>run.sh</b>.</div>`:''})()}
   <div class="note"><b>Google Ads рахує покупок більше, ніж їх реально в CRM — і це не помилка.</b>
     Кабінет додає конверсії з переглядів відео в PMax і Demand Gen, кросдевайс і змодельовані конверсії,
     яких немає в останньому кліку. ${(()=>{const w=rows.filter(r=>kx(r)).reduce((a,b)=>kx(a)>kx(b)?a:b);
       return `Пік розриву — ${MNF[+w.mk.slice(5)-1]} ${w.mk.slice(0,4)}: кабінет показав у ${x(kx(w))} більше покупок, ніж дійшло до CRM.
       Далі розрив звужувався, станом на ${MNF[+last.mk.slice(5)-1]} ${last.mk.slice(0,4)} — ${x(kx(last))}.`})()}
     <b>Транзакції GA4 майже збігаються з CRM</b>, тому саме вони — робочий орієнтир,
     а «ROAS чистий» (сума CRM ÷ витрати) — найчесніша цифра для розмови про гроші.</div>
   <h2>Покупки: кабінет, GA4 і CRM<span class="hint">стовпчики — Google Ads, лінія — CRM</span></h2>
   <div class="panel" id="crmch"></div>
   <h2>Кабінет проти CRM</h2>
   <div class="tbl-wrap scroll"><table><thead><tr><th class="l">Місяць</th>
     <th>Покупки Ads</th><th>Транз. GA4</th><th>Покупки CRM</th><th>Ads / CRM</th>
     <th>Цінність Ads</th><th>Сума CRM</th><th>Різниця</th>
     <th>ROAS кабінет</th><th>ROAS чистий</th><th>План</th><th>Виконання</th></tr></thead><tbody>
     ${rows.slice().reverse().map(r=>{const c=r.c,d1=delta(r.A.conv,c.orders),d2=delta(r.A.val,c.revenue);
       return `<tr><td class="l"><b>${MN[+r.mk.slice(5)-1]} ${r.mk.slice(2,4)}</b></td>
       <td class="n">${fmt(r.A.conv,0)}</td><td class="n mut">${fmt(r.G[1])}</td><td class="n">${fmt(c.orders)}</td>
       <td class="n ${kx(r)>1.5?'dn':''}">${x(kx(r))}</td>
       <td class="n">${M(r.A.val,r.rt)}</td><td class="n">${M(c.revenue,r.rt)}</td><td class="n ${d2.c}">${d2.t}</td>
       <td class="n">${x(r.A.roas)}</td><td class="n">${x(c.revenue/r.A.costV)}</td>
       <td class="n">${c.plan?M(c.plan,r.rt):'—'}</td>
       <td class="n">${c.plan?pct(c.revenue/c.plan,0):'—'}</td></tr>`}).join('')}
   </tbody></table></div>`;
  $('#crmch').innerHTML=chart(rows.map(r=>MN[+r.mk.slice(5)-1]+' '+r.mk.slice(2,4)),
    rows.map(r=>r.A.conv), rows.map(r=>r.c.orders),
    {h:230,tips:rows.map(r=>`${MNF[+r.mk.slice(5)-1]} ${r.mk.slice(0,4)}\nкабінет ${fmt(r.A.conv,0)}\nGA4 ${fmt(r.G[1])}\nCRM ${fmt(r.c.orders)}\nкабінет / CRM ${x(kx(r))}`)});
  $('#curseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ST.cur=b.dataset.c;render()});
}
</script>
